name: APK bauen

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:   # Knopf "Run workflow" auf GitHub

jobs:
  build:
    # feste Version: "ubuntu-latest" wechselt ab 19.10.2026 auf Ubuntu 26
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Das Android SDK ist auf dem GitHub-Rechner bereits installiert
      # (ANDROID_HOME). Der frühere Hilfsschritt "android-actions/setup-android"
      # schlägt seit Oktober 2026 fehl und wird nicht mehr gebraucht.
      - name: Android SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK hochladen
        uses: actions/upload-artifact@v5
        with:
          name: reihen-navigator-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
